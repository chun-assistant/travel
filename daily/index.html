<body data-page="days">
  <div class="app-shell">
    <header class="hero">
      <div class="stars"></div>
      <div class="hero-inner">
        <div class="eyebrow">
          <span>EUROPE · AURORA 2026</span>
          <span class="eyebrow-badge" id="networkBadge"><i class="online-dot"></i><span>離線可查看</span></span>
        </div>
        <h1>18天歐洲極光之旅</h1>
        <p class="hero-sub">09.24–10.11｜奧地利・芬蘭・挪威・荷蘭</p>
        <div class="hero-stats">
          <div class="hero-stat"><b>18 天</b><small>完整逐時行程</small></div>
          <div class="hero-stat"><b>248 站</b><small>一鍵開啟導航</small></div>
          <div class="hero-stat"><b id="countdownValue">—</b><small id="countdownLabel">距離出發</small></div>
        </div>
      </div>
    </header>

    <main>
      <section class="tab-panel active" id="tab-days" aria-labelledby="nav-days">
        <div class="section-head"><div><h2>每日行程</h2><p>照時間走，也保留舒適彈性</p></div><button class="small-action" id="jumpToday">跳至當日</button></div>
        <aside class="timezone-note" aria-label="行程時區提醒">
          <span class="timezone-note-icon" aria-hidden="true">🕒</span>
          <div><strong>以下行程皆以所在地當地時間顯示</strong><p><span aria-hidden="true">🇹🇼</span> 台灣比芬蘭快 5 小時；比奧地利、挪威、荷蘭快 6 小時</p></div>
        </aside>
        <div class="notice-stack" id="globalNotices"></div>
        <div class="country-overview"><div class="country-overview-head"><b>國家路線</b><small>跨境日會同時列入前後兩國</small></div><div class="country-scroll" id="countryScroll"><div class="country-track" id="countryTrack"></div></div></div>
        <div class="day-scroller" id="dayScroller" aria-label="選擇日期"></div>
        <div id="daySummary"></div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input class="search-input" id="eventSearch" type="search" placeholder="搜尋景點、餐廳、交通…" autocomplete="off">
        </div>
        <div class="filter-row" id="eventFilters"></div>
        <div class="timeline" id="eventTimeline"></div>
      </section>

      <section class="tab-panel" id="tab-luggage" aria-labelledby="nav-luggage">
        <div class="section-head"><div><h2>行前工具</h2><p>行李、實用資訊與訂位</p></div></div>
        <div class="segmented" id="luggageSegments">
          <button class="segment active" data-sub="check">行李清單</button>
          <button class="segment" data-sub="practical">實用資訊</button>
          <button class="segment" data-sub="bookings">訂位</button>
        </div>
        <div class="subview active" id="luggage-check"><div id="checkSummary"></div><div id="checkList"></div></div>
        <div class="subview" id="luggage-practical"><div id="practicalList"></div></div>
        <div class="subview" id="luggage-bookings"><div id="bookingList"></div></div>
      </section>

      <section class="tab-panel" id="tab-budget" aria-labelledby="nav-budget">
        <div class="section-head"><div><h2>預算與餐飲</h2><p>每日花費、缺漏與餐飲清單</p></div></div>
        <div class="segmented" id="budgetSegments">
          <button class="segment active" data-sub="daily">每日預算</button>
          <button class="segment" data-sub="food">餐飲購物</button>
          <button class="segment" data-sub="meals">自理正餐</button>
        </div>
        <div class="subview active" id="budget-daily"><div id="budgetSummary"></div><div id="budgetList"></div></div>
        <div class="subview" id="budget-food"><div class="card-list" id="foodList"></div></div>
        <div class="subview" id="budget-meals"><div class="card-list" id="mealList"></div></div>
      </section>
    </main>
  </div>

</nav>
