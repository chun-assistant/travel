<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102d3e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2026歐洲之旅">
  <title>2026 歐洲極光之旅｜18天行程 App</title>
  <link rel="stylesheet" href="../assets/common.css">
</head>
<body>
<div class="app-shell"><header class="hero">
      <div class="stars"></div>
      <div class="hero-inner">
        <div class="eyebrow">
          <span>EUROPE · AURORA 2026</span>
          <span class="eyebrow-badge" id="networkBadge"><i class="online-dot"></i><span>離線可查看</span></span>
        </div>
        <h1>18天歐洲極光之旅</h1>
        <p class="hero-sub">2026.09.24 — 10.11 · 奧地利・芬蘭・挪威・荷蘭</p>
        <div class="route-line" aria-label="旅行路線">
          <span class="route-stop">台北</span><span class="route-arrow">›</span>
          <span class="route-stop">維也納</span><span class="route-arrow">›</span>
          <span class="route-stop">赫爾辛基</span><span class="route-arrow">›</span>
          <span class="route-stop">拉普蘭</span><span class="route-arrow">›</span>
          <span class="route-stop">特羅姆瑟</span><span class="route-arrow">›</span>
          <span class="route-stop">阿姆斯特丹</span>
        </div>
        <div class="hero-stats">
          <div class="hero-stat"><b>18 天</b><small>完整逐時行程</small></div>
          <div class="hero-stat"><b>248 站</b><small>一鍵開啟導航</small></div>
          <div class="hero-stat"><b id="countdownValue">—</b><small id="countdownLabel">距離出發</small></div>
        </div>
      </div>
    </header><main><section class="tab-panel active" id="tab-days" aria-labelledby="nav-days">
        <div class="section-head"><div><h2>每日行程</h2><p>照時間走，也保留舒適彈性</p></div><button class="small-action" id="jumpToday">跳至當日</button></div>
        <div class="notice-stack" id="globalNotices"></div>
        <div class="country-overview"><div class="country-overview-head"><b>國家路線</b><small>跨境日會同時列入前後兩國</small></div><div class="country-scroll" id="countryScroll"><div class="country-track" id="countryTrack"></div></div></div>
        <div class="day-scroller" id="dayScroller" aria-label="選擇日期"></div>
        <div id="daySummary"></div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input class="search-input" id="eventSearch" type="search" placeholder="搜尋景點、餐廳、交通…" autocomplete="off">
          <button class="clear-search" id="clearSearch" aria-label="清除搜尋">×</button>
        </div>
        <div class="chip-row" id="eventFilters" aria-label="行程類別"></div>
        <div class="timeline" id="eventTimeline"></div>
      </section></main><nav class="bottom-nav" aria-label="主要導覽">
    <button class="nav-btn active" id="nav-days" href="../daily/" data-tab="days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path></svg>每日行程</a>
    <a class="nav-btn" id="nav-transport" href="../transport/" data-tab="transport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 17h14M6 17l-1 3M18 17l1 3M6 4h12l2 10H4L6 4Z"></path><circle cx="8" cy="14" r="1"></circle><circle cx="16" cy="14" r="1"></circle></svg>交通</a>
    <a class="nav-btn" id="nav-hotels" href="../stay/" data-tab="hotels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 20V7l9-4 9 4v13M7 20v-5h10v5M8 9h.01M12 9h.01M16 9h.01M8 12h.01M12 12h.01M16 12h.01"></path></svg>住宿</a>
    <a class="nav-btn" id="nav-luggage" href="../prep-tools/" data-tab="luggage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="6" width="14" height="15" rx="2"></rect><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M9 10v7M15 10v7"></path></svg>行前與工具</a>
    <a class="nav-btn" id="nav-budget" href="../budget/" data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>預算</a>
  </nav></div>
<script src="../assets/common.js"></script>
</body>
</html>
