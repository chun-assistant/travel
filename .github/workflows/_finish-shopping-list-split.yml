name: finish shopping list split

on:
  push:
    branches:
      - refactor/finland-shopping-data-20260910

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/finland-shopping-data-20260910
          fetch-depth: 0
      - name: Extract shopping list runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('budget/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="../assets/modules/shopping/recommendations.js?v=20260910-shopping2"></script>'
          new = old + '\n<script src="../assets/modules/shopping/shopping-list.js?v=20260910-shopping3"></script>'
          if 'shopping-list.js?v=20260910-shopping3' not in text:
              if old not in text:
                  raise SystemExit('recommendations script tag not found')
              text = text.replace(old, new, 1)

          pattern = re.compile(r"\n  const KEY='aurora-shopping-list-v1';.*?\n  render\(\);", re.S)
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'shopping inline block replacement count={count}')

          path.write_text(text, encoding='utf-8')
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget/index.html .github/workflows/_finish-shopping-list-split.yml
          git commit -m "refactor: extract shopping list runtime"
          git push origin HEAD:refactor/finland-shopping-data-20260910
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/_finish-shopping-list-split.yml
          git commit -m "chore: remove temporary shopping split workflow"
          git push origin HEAD:refactor/finland-shopping-data-20260910
