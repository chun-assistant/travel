name: split shopping recommendations
on:
  push:
    branches: [refactor/finland-shopping-data-20260910]
    paths:
      - '.github/_inspect-shopping-recommendations-trigger'
jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/finland-shopping-data-20260910
      - name: Wire recommendation module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('budget/index.html')
          s=p.read_text(encoding='utf-8')
          start="  $('#supermarketList').innerHTML="
          end="  const KEY='aurora-shopping-list-v1';"
          a=s.find(start)
          b=s.find(end,a)
          if a<0 or b<0 or b<=a:
              raise SystemExit(f'Recommendation boundaries not found: {a}, {b}')
          replacement="  const recommendations=window.TravelShoppingRecommendations;\n  if(!recommendations)throw new Error('Travel Shopping recommendations module is not loaded.');\n  recommendations.render(data);\n"
          s=s[:a]+replacement+s[b:]
          marker='<script src="../assets/modules/shopping/bootstrap.js?v=20260910-shopping1"></script>\n'
          if s.count(marker)!=1:
              raise SystemExit('Shopping bootstrap script tag not found exactly once')
          s=s.replace(marker,marker+'<script src="../assets/modules/shopping/recommendations.js?v=20260910-shopping2"></script>\n',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary files
        run: rm -f .github/workflows/_inspect-shopping-recommendations.yml .github/_inspect-shopping-recommendations-trigger .github/shopping-recommendations-inspection.txt .github/workflows/_split-shopping-recommendations.yml .github/_split-shopping-recommendations-trigger
      - name: Commit split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/index.html assets/modules/shopping/recommendations.js .github/workflows/_inspect-shopping-recommendations.yml .github/_inspect-shopping-recommendations-trigger .github/shopping-recommendations-inspection.txt .github/workflows/_split-shopping-recommendations.yml .github/_split-shopping-recommendations-trigger
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: isolate Shopping recommendations renderer'
          git push
