name: inspect shopping recommendations
on:
  push:
    branches: [refactor/finland-shopping-data-20260910]
    paths:
      - '.github/_inspect-shopping-recommendations-trigger'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/finland-shopping-data-20260910
      - name: Inspect renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('budget/index.html').read_text(encoding='utf-8')
          for needle in ['function renderSupermarkets','function renderSouvenirs','data-add-item']:
              i=s.find(needle)
              print('\n===',needle,'at',i,'===')
              print(s[max(0,i-1200):i+5000])
          PY
