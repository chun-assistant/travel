name: wire-daily-meals
on:
  push:
    paths:
      - .github/_wire-daily-meals-trigger
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Daily meals script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('daily/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="../assets/modules/daily-meals.js?v=20260910-meals1"></script>\n'
          if '../assets/modules/daily-meals.js' not in s:
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('No </body> found')
              s = s[:pos] + tag + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/_wire-daily-meals-trigger .github/workflows/_wire-daily-meals.yml
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily/index.html .github/_wire-daily-meals-trigger .github/workflows/_wire-daily-meals.yml
          git commit -m 'refactor: wire Daily meals module'
          git push
