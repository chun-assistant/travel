name: Fix flight check-in chip layout
on:
  push:
    branches: [europe-trip-2026]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Fix flight check-in chip layout')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace flight check-in CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/common.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Flight online check-in reminder. */'
          i = s.find(marker)
          if i < 0:
              raise SystemExit('flight CSS marker not found')
          s = s[:i].rstrip() + '''

/* Flight online check-in reminder — layout-safe highlight. */
.day-chip[data-day="1"],
.day-chip[data-day="9"],
.day-chip[data-day="14"],
.day-chip[data-day="15"] { position: relative; box-shadow: 0 0 0 2px rgba(197,90,83,.22), 0 8px 18px rgba(197,90,83,.10); }
.day-chip[data-day="1"]::after,
.day-chip[data-day="9"]::after,
.day-chip[data-day="14"]::after,
.day-chip[data-day="15"]::after {
  content: "";
  position: absolute;
  top: 6px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 3px var(--red-soft);
}
.day-chip[data-day="1"]::before,
.day-chip[data-day="9"]::before,
.day-chip[data-day="14"]::before,
.day-chip[data-day="15"]::before {
  position: absolute;
  right: 7px;
  bottom: 6px;
  z-index: 2;
  display: block;
  padding: 3px 6px;
  border-radius: 999px;
  color: var(--red);
  background: var(--red-soft);
  border: 1px solid rgba(197,90,83,.28);
  font-size: 9px;
  line-height: 1.15;
  font-weight: 850;
  white-space: nowrap;
  pointer-events: none;
}
.day-chip[data-day="1"]::before { content: "✈ 報到 9/24 23:35"; }
.day-chip[data-day="9"]::before { content: "✈ 報到 10/2 03:40"; }
.day-chip[data-day="14"]::before { content: "✈ 報到 10/7 05:50"; }
.day-chip[data-day="15"]::before { content: "✈ 報到 10/8 11:00"; }
.day-chip.active[data-day="1"]::before,
.day-chip.active[data-day="9"]::before,
.day-chip.active[data-day="14"]::before,
.day-chip.active[data-day="15"]::before { color:#fff; background:rgba(197,90,83,.84); border-color:rgba(255,255,255,.30); }
.day-chip.active[data-day="1"],
.day-chip.active[data-day="9"],
.day-chip.active[data-day="14"],
.day-chip.active[data-day="15"] { box-shadow: 0 0 0 2px rgba(197,90,83,.55), 0 8px 18px rgba(197,90,83,.18); }
'''
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/common.css
          git commit -m "Fix flight check-in chip layout"
          git push
