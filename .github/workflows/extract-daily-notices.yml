name: extract-daily-notices
on:
  push:
    branches: [refactor-transport-safe-v2]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message != 'chore: extract daily notices module'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract renderNotices
        shell: python
        run: |
          from pathlib import Path
          import re

          runtime = Path('assets/common-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          marker = 'function renderNotices() {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('renderNotices marker not found')

          i = start + len(marker) - 1
          depth = 0
          in_str = None
          esc = False
          in_line = False
          in_block = False
          end = None
          while i < len(text):
              c = text[i]
              n = text[i+1] if i+1 < len(text) else ''
              if in_line:
                  if c == '\n': in_line = False
              elif in_block:
                  if c == '*' and n == '/': in_block = False; i += 1
              elif in_str:
                  if esc: esc = False
                  elif c == '\\': esc = True
                  elif c == in_str: in_str = None
              else:
                  if c == '/' and n == '/': in_line = True; i += 1
                  elif c == '/' and n == '*': in_block = True; i += 1
                  elif c in "'\"`": in_str = c
                  elif c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1
          if end is None:
              raise SystemExit('could not balance renderNotices')

          fn = text[start:end]
          body = fn.replace('function renderNotices() {', 'function renderNotices(deps) {', 1)
          body = body.replace('$("#globalNotices")', 'deps.$("#globalNotices")').replace('escapeHtml(', 'deps.escapeHtml(')
          module = '''/* Daily notices renderer — extracted from common-runtime.js. */\n(function (root) {\n  function createRenderer(deps) {\n'''
          module += ''.join('    ' + line if line.strip() else line for line in body.splitlines(True))
          module += '''    return renderNotices;\n  }\n  root.TravelDailyNotices = Object.freeze({ create: createRenderer });\n})(window);\n'''
          out = Path('assets/modules/daily-notices.js')
          out.write_text(module, encoding='utf-8')

          wrapper = '''function renderNotices() {\n      if (window.TravelDailyNotices && typeof window.TravelDailyNotices.create === "function") {\n        window.TravelDailyNotices.create({ $: $, escapeHtml: escapeHtml })();\n      }\n    }'''
          text = text[:start] + wrapper + text[end:]
          runtime.write_text(text, encoding='utf-8')

          common = Path('assets/common.js')
          c = common.read_text(encoding='utf-8')
          needle = 'document.write(\'<script src="\' + legacySrc.replace(/"/g, "&quot;") + \'"><\\/script>\');'
          repl = 'document.write(\'<script src="\' + base + \'modules/daily-notices.js"><\\/script>\');\n    ' + needle
          if needle not in c:
              raise SystemExit('common.js document.write insertion point not found')
          c = c.replace(needle, repl, 1)
          needle2 = 'var scripts = [packingDataSrc, printDataSrc, coreDataSrc, legacySrc, base + "modules/flight-badges.js"];'
          repl2 = 'var scripts = [packingDataSrc, printDataSrc, coreDataSrc, base + "modules/daily-notices.js", legacySrc, base + "modules/flight-badges.js"];'
          if needle2 not in c:
              raise SystemExit('common.js async insertion point not found')
          c = c.replace(needle2, repl2, 1)
          common.write_text(c, encoding='utf-8')
      - name: Verify
        run: |
          test -s assets/modules/daily-notices.js
          grep -q 'TravelDailyNotices' assets/common-runtime.js
          grep -q 'modules/daily-notices.js' assets/common.js
          test "$(grep -c 'function renderNotices' assets/common-runtime.js)" -eq 1
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/common-runtime.js assets/common.js assets/modules/daily-notices.js
          git commit -m 'chore: extract daily notices module'
          git rm .github/workflows/extract-daily-notices.yml
          git commit -m 'chore: remove daily notices migration workflow'
          git push
