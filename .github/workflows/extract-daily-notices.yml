name: extract daily notices

on:
  push:
    branches: [refactor-transport-safe-v2]

permissions:
  contents: write

jobs:
  extract:
    if: contains(github.event.head_commit.message, '[skip daily extract]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-transport-safe-v2
      - name: Extract renderNotices
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('assets/common-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          pattern = re.compile(r'\n    function renderNotices\(\) \{.*?\n    \}\n\n    function renderDayScroller', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('renderNotices block not found')
          block = match.group(0)
          fn = block[len('\n'):block.rfind('\n\n    function renderDayScroller')]
          runtime.write_text(text[:match.start()] + '\n\n    function renderDayScroller' + text[match.end():], encoding='utf-8')

          module = '''/* Daily notices renderer extracted from common-runtime.js. */\n(function (root) {\n  var $ = function (selector) { return document.querySelector(selector); };\n  var escapeHtml = function (value) {\n    return String(value == null ? "" : value).replace(/[&<>'"]/g, function (ch) {\n      return ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[ch];\n    });\n  };\n  root.renderNotices = function () {\n    var notices = [\n      ["🚆","9/25機場交通已修正","VIE搭REX7／Railjet至Wien Hbf，再轉U1；不是機場接送。"],\n      ["⛪","9/27白教堂週日時段","09:15先拍外觀；若要入內，依官方週日12:00後時段回訪。"],\n      ["🍽️","餐食限制","全團避開牛肉與game meat（馴鹿、麋鹿、鹿肉等）；可選雞、豬、魚或素食。"],\n      ["❄️","舒適優先","強風、結冰或長距離時可分流、改短程計程車，不勉強走海岸冰面。"],\n    ];\n    var host = $("#globalNotices");\n    if (!host) return;\n    host.innerHTML = notices.map(function (n) {\n      return '<article class="notice"><div class="notice-icon">' + n[0] + '</div><div><strong>' + escapeHtml(n[1]) + '</strong><p>' + escapeHtml(n[2]) + '</p></div></article>';\n    }).join("");\n  };\n})(window);\n'''
          Path('assets/modules/daily-notices.js').write_text(module, encoding='utf-8')

          common = Path('assets/common.js')
          c = common.read_text(encoding='utf-8')
          needle = 'document.write(\'<script src="\' + legacySrc.replace(/"/g, "&quot;") + \'"><\\/script>\');'
          replacement = 'document.write(\'<script src="\' + base + "modules/daily-notices.js" + \'"><\\/script>\');\n      document.write(\'<script src="\' + legacySrc.replace(/"/g, "&quot;") + \'"><\\/script>\');'
          if needle not in c:
              raise SystemExit('document.write legacy line not found')
          c = c.replace(needle, replacement, 1)
          needle2 = 'var scripts = [packingDataSrc, coreDataSrc, printDataSrc, legacySrc, base + "modules/flight-badges.js"];'
          replacement2 = 'var scripts = [packingDataSrc, coreDataSrc, printDataSrc, base + "modules/daily-notices.js", legacySrc, base + "modules/flight-badges.js"];'
          if needle2 not in c:
              raise SystemExit('async scripts line not found')
          c = c.replace(needle2, replacement2, 1)
          common.write_text(c, encoding='utf-8')
          PY

          git diff --check
          test -s assets/modules/daily-notices.js
          ! grep -q 'function renderNotices' assets/common-runtime.js
          git status --short
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/common-runtime.js assets/common.js assets/modules/daily-notices.js .github/workflows/extract-daily-notices.yml
          git commit -m 'refactor: extract daily notices renderer [skip daily extract]'
          git push origin HEAD:refactor-transport-safe-v2
          git rm .github/workflows/extract-daily-notices.yml
          git commit -m 'chore: remove daily notices extraction workflow [skip daily extract]'
          git push origin HEAD:refactor-transport-safe-v2
