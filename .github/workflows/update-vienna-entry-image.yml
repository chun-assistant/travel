name: Rebuild travel site from original UI
on:
  push:
    branches:
      - europe-trip-2026
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0
      - name: Rebuild split pages
        run: python3 rebuild_pages.py
      - name: Commit rebuilt site and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f rebuild_pages.py .github/workflows/update-vienna-entry-image.yml || true
          git commit -m "Restore original UI and split feature pages"
          git push origin europe-trip-2026
