name: repair runtime
on:
  push:
    branches:
      - refactor-transport-safe-v2
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore intact runtime
        shell: bash
        run: |
          git checkout 89981ee37287a2c6e9393925dfb62896caaa37f7 -- assets/common-runtime.js
          git add assets/common-runtime.js
          git config user.name "chun-assistant"
          git config user.email "yonglinchun@gmail.com"
          git commit -m "fix: restore intact common runtime" || true
          git push
      - name: Remove repair workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-runtime.yml || true
          git commit -m "chore: remove runtime repair workflow" || true
          git push
