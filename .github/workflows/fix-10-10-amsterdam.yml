name: Sync upstream Europe trip changes
on:
  push:
    branches: [europe-trip-2026]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cherry-pick today's upstream commits
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yangchinghsuan955-web/europe-trip-2026.git
          git fetch upstream main
          mapfile -t commits < <(git log --reverse --since="2026-09-07 00:00:00 UTC" --format=%H upstream/main)
          echo "Upstream commits today: ${#commits[@]}"
          for sha in "${commits[@]}"; do
            echo "Cherry-picking $sha"
            if git cherry-pick "$sha"; then
              continue
            fi
            if git diff --name-only --diff-filter=U | grep -qx 'assets/common.js'; then
              git checkout --ours -- assets/common.js
              git add assets/common.js
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo 'Unresolved conflicts remain outside common.js'
                git cherry-pick --abort
                exit 1
              fi
              GIT_EDITOR=true git cherry-pick --continue
            else
              echo 'Unexpected conflict; aborting rather than guessing.'
              git cherry-pick --abort
              exit 1
            fi
          done
      - name: Verify 10/10 train correction survived
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/common.js')
          s = p.read_text(encoding='utf-8')
          if '06:55 Amsterdam Sloterdijk搭車' not in s or 'NS Sprinter 8223 Hoofddorp' not in s:
              raise SystemExit('10/10 train correction was lost during cherry-pick')
          if 'Amsterdam ID→AMS' in s or '7人van' in s:
              raise SystemExit('stale 10/10 van data detected after cherry-pick')
          print('10/10 train correction verified')
          PY
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync upstream changes while preserving itinerary fixes"
          git push
