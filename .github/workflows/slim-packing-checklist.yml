name: One-shot packing data migration

on:
  push:
    branches: [refactor-transport-safe-v2]
    paths:
      - .github/workflows/slim-packing-checklist.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-transport-safe-v2
          fetch-depth: 0

      - name: Extract packing data only
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          runtime_path = root / 'assets/common-runtime.js'
          runtime = runtime_path.read_text(encoding='utf-8')
          pattern = re.compile(r'const PACKING_GROUPS = \[(.*?)\];\n    const PRINT_GROUPS', re.S)
          match = pattern.search(runtime)
          if not match:
              raise SystemExit('Expected PACKING_GROUPS block was not found; refusing to modify runtime.')
          items = match.group(1).strip()
          data = '''/*
 * Packing data boundary.
 *
 * Extracted from common-runtime.js without changing the data itself.
 */
(function (root) {
  var groups = [%s];
  root.TravelPackingData = Object.freeze({
    getGroups: function () {
      return groups.slice();
    }
  });
})(window);
''' % items
          (root / 'assets/data/packing.js').write_text(data, encoding='utf-8')
          runtime = runtime[:match.start()] + 'const PACKING_GROUPS = window.TravelPackingData.getGroups();\n    const PRINT_GROUPS' + runtime[match.end():]
          runtime_path.write_text(runtime, encoding='utf-8')

          common_path = root / 'assets/common.js'
          common = common_path.read_text(encoding='utf-8')
          old1 = "      document.write('<script src=\"' + legacySrc.replace(/\"/g, '&quot;') + '\"><\\/script>');"
          new1 = "      document.write('<script src=\"' + base + 'data/packing.js'><\\/script>');\n      document.write('<script src=\"' + legacySrc.replace(/\"/g, '&quot;') + '\"><\\/script>');"
          if common.count(old1) != 1:
              raise SystemExit('Expected legacy loader anchor was not found; refusing to modify common.js.')
          common = common.replace(old1, new1, 1)
          old2 = '    var scripts = [legacySrc];'
          new2 = '    var scripts = [base + "data/packing.js", legacySrc];'
          if common.count(old2) != 1:
              raise SystemExit('Expected dynamic legacy loader anchor was not found; refusing to modify common.js.')
          common = common.replace(old2, new2, 1)
          common_path.write_text(common, encoding='utf-8')

          final_runtime = runtime_path.read_text(encoding='utf-8')
          if 'const PACKING_GROUPS = [' in final_runtime:
              raise SystemExit('Legacy PACKING_GROUPS array still exists in common-runtime.js')
          if 'const PACKING_GROUPS = window.TravelPackingData.getGroups();' not in final_runtime:
              raise SystemExit('New PACKING_GROUPS data boundary reference is missing')

      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/common-runtime.js assets/common.js assets/data/packing.js
          git diff --cached --check
          git commit -m "refactor: extract packing data from runtime [skip ci]"
          git rm .github/workflows/slim-packing-checklist.yml
          git commit -m "chore: remove one-shot packing data workflow [skip ci]"
          git push origin refactor-transport-safe-v2
