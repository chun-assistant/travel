name: Temporary sync upstream images

on:
  push:
    branches: [europe-trip-2026]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'chore: sync upstream image assets [bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 1

      - name: Copy upstream image assets
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream
          git clone --depth 1 --branch main https://github.com/yangchinghsuan955-web/europe-trip-2026.git /tmp/upstream
          mkdir -p assets
          cd /tmp/upstream
          while IFS= read -r -d '' file; do
            rel="${file#/tmp/upstream/}"
            case "$rel" in
              *.png|*.jpg|*.jpeg|*.webp|*.gif|*.svg|*.avif|*.ico)
                mkdir -p "$GITHUB_WORKSPACE/$(dirname "$rel")"
                cp -f "$file" "$GITHUB_WORKSPACE/$rel"
                ;;
            esac
          done < <(find assets -type f -print0)

      - name: Remove temporary workflow
        run: rm -f .github/workflows/_sync-upstream-images.yml

      - name: Commit synced images
        run: |
          set -euo pipefail
          git config user.name "chun-assistant"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets .github/workflows/_sync-upstream-images.yml
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "chore: sync upstream image assets [bot]"
          git push origin HEAD:europe-trip-2026
