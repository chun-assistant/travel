name: Fix feature page navigation

on:
  push:
    branches: [europe-trip-2026]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 1
      - name: Patch navigation
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          pages = {
              'daily': 'days',
              'transport': 'transport',
              'stay': 'hotels',
              'prep-tools': 'luggage',
              'budget': 'budget',
          }
          routes = {
              'days': '../daily/',
              'transport': '../transport/',
              'hotels': '../stay/',
              'luggage': '../prep-tools/',
              'budget': '../budget/',
          }
          patch = '''\n<script>\ndocument.addEventListener('click', function (event) {\n  const btn = event.target.closest('.bottom-nav .nav-btn[data-tab]');\n  if (!btn) return;\n  event.preventDefault();\n  const routes = %s;\n  const href = routes[btn.dataset.tab];\n  if (href) window.location.href = href;\n}, true);\n</script>\n''' % repr(routes)
          for folder in pages:
              p = Path(folder) / 'index.html'
              text = p.read_text(encoding='utf-8')
              marker = "window.location.href = href;"
              if marker not in text:
                  text = text.replace('</body>', patch + '</body>', 1)
                  p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/index.html transport/index.html stay/index.html prep-tools/index.html budget/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix feature page navigation routing"
          git push origin europe-trip-2026
