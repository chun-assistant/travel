name: Migrate print groups

on:
  push:
    branches:
      - refactor-transport-safe-v2
    paths:
      - 'assets/common-runtime.js'
      - 'assets/common.js'
      - '.github/workflows/migrate-print-groups.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[print-groups-migrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PRINT_GROUPS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/common-runtime.js')
          s=p.read_text(encoding='utf-8')
          marker='const PRINT_GROUPS = ['
          start=s.find(marker)
          if start<0: raise SystemExit('PRINT_GROUPS declaration not found')
          end=s.find('];',start)
          if end<0: raise SystemExit('PRINT_GROUPS end not found')
          end+=2
          arr=s[start+len('const PRINT_GROUPS = '):end]
          data='''/* Extracted from the legacy runtime. Keep the data shape unchanged. */\n(function (root) {\n  const PRINT_GROUPS = %s;\n  root.TravelPrintData = Object.freeze({\n    getGroups: function () { return PRINT_GROUPS; }\n  });\n})(window);\n''' % arr
          Path('assets/data/print.js').write_text(data,encoding='utf-8')
          s=s[:start]+'const PRINT_GROUPS = window.TravelPrintData.getGroups();'+s[end:]
          p.write_text(s,encoding='utf-8')
          c=Path('assets/common.js')
          cs=c.read_text(encoding='utf-8')
          old='var packingDataSrc = base + "data/packing.js";'
          new='var packingDataSrc = base + "data/packing.js";\n  var printDataSrc = base + "data/print.js";'
          if old not in cs: raise SystemExit('packing loader marker not found')
          cs=cs.replace(old,new,1)
          cs=cs.replace("document.write('<script src=\"' + packingDataSrc + '\"><\\/script>');","document.write('<script src=\"' + packingDataSrc + '\"><\\/script>');\n    document.write('<script src=\"' + printDataSrc + '\"><\\/script>');",1)
          cs=cs.replace('var scripts = [packingDataSrc, legacySrc];','var scripts = [packingDataSrc, printDataSrc, legacySrc];',1)
          c.write_text(cs,encoding='utf-8')
          PY
      - name: Verify
        run: |
          test -s assets/data/print.js
          ! grep -q 'const PRINT_GROUPS = \[' assets/common-runtime.js
          grep -q 'TravelPrintData' assets/common-runtime.js
          grep -q 'data/print.js' assets/common.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/print.js assets/common-runtime.js assets/common.js .github/workflows/migrate-print-groups.yml
          git commit -m 'refactor: extract print groups from common runtime [print-groups-migrated]'
          git rm .github/workflows/migrate-print-groups.yml
          git commit -m 'chore: remove print groups migration workflow'
          git push
