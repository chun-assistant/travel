name: Fix split page tab state
on:
  push:
    branches: [europe-trip-2026]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'fix: trigger split page tab repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
      - name: Patch common.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/common.js')
          s=p.read_text(encoding='utf-8')
          marker='/* Split-page tab lock: each split page must show its own feature regardless of saved tab state. */'
          if marker not in s:
              s += '''\n\n/* Split-page tab lock: each split page must show its own feature regardless of saved tab state. */\ndocument.addEventListener('DOMContentLoaded', function(){\n  const page = document.body && document.body.dataset ? document.body.dataset.page : '';\n  const tab = {days:'days', transport:'transport', hotels:'hotels', luggage:'luggage', budget:'budget'}[page];\n  if (tab && typeof showTab === 'function') {\n    try { showTab(tab, false); } catch (e) {}\n  }\n});\n'''
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/common.js
          git commit -m 'fix: lock split pages to their own tab state' || true
          git push origin europe-trip-2026
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .github/workflows/fix-split-page-tabs.yml ]; then
            git rm .github/workflows/fix-split-page-tabs.yml
            git commit -m 'chore: remove one-time split page fix workflow'
            git push origin europe-trip-2026
          fi
