name: Copy upstream image assets

on:
  push:
    branches:
      - sync/upstream-images-20260910

permissions:
  contents: write

jobs:
  copy-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-images-20260910
          fetch-depth: 1

      - name: Copy image assets from upstream
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch main https://github.com/yangchinghsuan955-web/europe-trip-2026.git "$tmp/upstream"

          mkdir -p assets/app-icons
          cp "$tmp/upstream/assets/app-icons/06A7E4CE-2A0A-437E-A785-8EFF6C5A8D70.png" assets/app-icons/
          cp "$tmp/upstream/assets/app-icons/IMG_8478.jpeg" assets/app-icons/
          cp "$tmp/upstream/assets/app-icons/aurora.svg" assets/app-icons/
          cp "$tmp/upstream/assets/app-icons/tax.png" assets/app-icons/
          cp "$tmp/upstream/assets/app-icons/tax.svg" assets/app-icons/
          cp "$tmp/upstream/assets/app-icons/tools.svg" assets/app-icons/
          cp "$tmp/upstream/assets/app-icons/transport.svg" assets/app-icons/
          cp "$tmp/upstream/assets/apple-touch-icon-v2.png" assets/
          cp "$tmp/upstream/assets/apple-touch-icon.png" assets/
          cp "$tmp/upstream/assets/favicon-32.png" assets/
          cp "$tmp/upstream/assets/icon-192.png" assets/
          cp "$tmp/upstream/assets/icon-512.png" assets/
          cp "$tmp/upstream/assets/icon-maskable-512.png" assets/
          cp "$tmp/upstream/assets/meal-overview.png" assets/

          rm -rf "$tmp"

      - name: Remove temporary workflow and trigger marker
        run: |
          rm -f .github/workflows/_copy-upstream-images.yml .upstream-images-trigger

      - name: Commit image assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets .github/workflows/_copy-upstream-images.yml .upstream-images-trigger
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "assets: copy upstream image assets"
          git push origin HEAD:sync/upstream-images-20260910
