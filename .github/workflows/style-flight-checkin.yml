name: Style flight check-in badges
on:
  push:
    branches: [europe-trip-2026]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add badge styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/common.js')
          s=p.read_text(encoding='utf-8')
          marker='/* FLIGHT_CHECKIN_INLINE_STYLE */'
          if marker not in s:
              needle='          chip.classList.add(\'has-flight-checkin\');'
              repl='''          chip.classList.add('has-flight-checkin');
          const badge=chip.querySelector('.flight-checkin-badge');
          if(badge){ badge.style.cssText='display:block;margin-top:4px;padding:3px 6px;border-radius:999px;color:#c55a53;background:#fdeae6;border:1px solid rgba(197,90,83,.28);font-size:9px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'; }
          if(chip.classList.contains('active')){ badge.style.color='#fff'; badge.style.background='rgba(197,90,83,.82)'; badge.style.borderColor='rgba(255,255,255,.28)'; }
          /* FLIGHT_CHECKIN_INLINE_STYLE */'''
              if needle not in s: raise SystemExit('needle not found')
              p.write_text(s.replace(needle,repl,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/common.js
          git diff --cached --quiet && exit 0
          git commit -m "Style highlighted flight check-in badges"
          git push
