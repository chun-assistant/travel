name: One-shot Day 17 update
on:
  push:
    branches: [europe-trip-2026]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Day 17 itinerary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/common.js')
          s = p.read_text(encoding='utf-8')
          old_event = '''{"day":17,"date":"2026-10-10","city":"阿姆斯特丹","start":"07:15","end":"08:05","type":"交通","title":"7人van前往AMS；原表不辦退稅版本可最晚07:40出發","place":"Amsterdam Airport Schiphol Departure Hall","map":"https://www.google.com/maps/search/?api=1&query=7%E4%BA%BAvan%E5%89%8D%E5%BE%80AMS%EF%BC%9B%E5%8E%9F%E8%A1%A8%E4%B8%8D%E8%BE%A6%E9%80%80%E7%A8%85%E7%89%88%E6%9C%80%E6%99%9A07%3A40%E5%87%BA%E7%99%BC%20Amsterdam%20Airport%20Schiphol%20Departure%20Hall","transport":"預約7人van","duration":"約25–40分鐘＋塞車緩衝","currency":"EUR","cost":null,"costNote":"車資待填","status":"待確認","ticket":"司機／車型待填","note":"本最終版以退稅需求採07:15；原表07:40保留在備註","source":"2026歐洲之旅.xlsx"}'''
          new_event = '''{"day":17,"date":"2026-10-10","city":"阿姆斯特丹","start":"06:45","end":"07:05","type":"交通","title":"Amsterdam ID Aparthotel→Schiphol Airport","place":"Amsterdam ID Aparthotel → Amsterdam Sloterdijk → Schiphol Airport","map":"https://www.google.com/maps/search/?api=1&query=Amsterdam%20ID%20Aparthotel%E2%86%92Amsterdam%20Sloterdijk%E2%86%92Schiphol%20Airport","transport":"步行＋NS Sprinter 8223 Hoofddorp","duration":"約20分鐘","currency":"EUR","cost":4.9,"costNote":"EUR 4.9／人","status":"尚未購票","ticket":"NS Sprinter 8223","note":"06:45從Amsterdam ID Aparthotel出發；步行約10分鐘／700公尺到Amsterdam Sloterdijk；06:55搭Sprinter 8223 Hoofddorp，約10分鐘、2站、11號月台；07:05抵達Schiphol Airport。","source":"使用者提供路線截圖"}'''
          if old_event not in s:
              raise SystemExit('old Day 17 van event not found')
          s = s.replace(old_event, new_event, 1)
          old_overview = '{"day":17,"date":"2026-10-10","city":"阿姆斯特丹→台北","highlight":"AMS退稅；11:00 CI0074","transport":"7人van＋直飛","hotel":"機上","status":"接送待確認","effort":"低","original":0,"extra":1100,"estimate":1100,"note":"退稅版07:15離店；原表07:40"}'
          new_overview = '{"day":17,"date":"2026-10-10","city":"阿姆斯特丹→台北","highlight":"AMS退稅；11:00 CI0074","transport":"NS火車＋直飛","hotel":"機上","status":"火車待購","effort":"低","original":0,"extra":1100,"estimate":1100,"note":"06:45飯店出發；06:55 Sloterdijk搭Sprinter 8223；07:05抵達Schiphol"}'
          if old_overview not in s:
              raise SystemExit('old Day 17 overview not found')
          s = s.replace(old_overview, new_overview, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/common.js
          git commit -m "fix: replace Day 17 van with NS train"
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/one-shot-day17.yml
          git add .github/workflows/one-shot-day17.yml
          git commit -m "chore: remove one-shot Day 17 workflow"
          git push