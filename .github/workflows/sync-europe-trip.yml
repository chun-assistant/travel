name: Sync Europe Trip

on:
  push:
    branches:
      - europe-trip-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0

      - name: Sync source repository
        run: |
          rm -rf /tmp/europe-trip-source
          git clone --depth 1 https://github.com/yangchinghsuan955-web/europe-trip-2026.git /tmp/europe-trip-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/europe-trip-source/. .
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/chun-assistant/travel.git"
          git fetch origin europe-trip-2026
          git checkout -B europe-trip-2026 origin/europe-trip-2026
          cp -a /tmp/europe-trip-source/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from yangchinghsuan955-web/europe-trip-2026" || true
          git push origin HEAD:europe-trip-2026
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
