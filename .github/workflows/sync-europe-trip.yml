name: Sync Europe Trip

on:
  push:
    branches:
      - europe-trip-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0

      - name: Sync source repository exactly
        run: |
          rm -rf /tmp/europe-trip-source
          git clone --depth 1 https://github.com/yangchinghsuan955-web/europe-trip-2026.git /tmp/europe-trip-source
          rsync -a --delete --exclude='.git' /tmp/europe-trip-source/ ./
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Source and target are already identical."
          else
            git commit -m "Sync europe-trip-2026 from source"
            git push origin HEAD:europe-trip-2026
          fi
