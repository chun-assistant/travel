name: Refine Day Country Scroll

on:
  push:
    branches:
      - europe-trip-2026

permissions:
  contents: write

jobs:
  refine:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    .day-scroller::-webkit-scrollbar, .chip-row::-webkit-scrollbar, .segmented::-webkit-scrollbar { display: none; }\n', '    .day-scroller, .country-scroll { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }\n    .day-scroller.dragging, .country-scroll.dragging { cursor: grabbing; }\n    .day-scroller::-webkit-scrollbar, .chip-row::-webkit-scrollbar, .segmented::-webkit-scrollbar { display: none; }\n', 1)
          s = s.replace('    .country-scroll { overflow: hidden; scrollbar-width: none; }\n    .country-scroll::-webkit-scrollbar { display: none; }\n    .country-track { position: relative; display: flex; width: 100%; min-width: 100%; height: 34px; padding: 0; align-items: flex-start; }\n    .country-track::before { content: ""; position: absolute; left: 0; right: 0; top: 23px; height: 3px; border-radius: 999px; background: linear-gradient(90deg,#db8b5d,#6eb7b0,#6088b8,#7898d7); }\n    .country-stage { position: relative; z-index: 1; flex: var(--stage-days,1); width: auto; min-width: 0; height: 34px; padding: 0 3px; border: 0; color: var(--ink); background: transparent; text-align: center; cursor: pointer; }\n', '    .country-scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }\n    .country-scroll::-webkit-scrollbar { display: none; }\n    .country-track { position: relative; display: grid; grid-template-columns: repeat(18, 126px); column-gap: 8px; width: calc(18 * 126px + 17 * 8px + 4px); min-width: calc(18 * 126px + 17 * 8px + 4px); height: 34px; padding: 0 2px; align-items: flex-start; }\n    .country-track::before { content: ""; position: absolute; left: 2px; right: 2px; top: 23px; height: 3px; border-radius: 999px; background: linear-gradient(90deg,#db8b5d,#6eb7b0,#6088b8,#7898d7); }\n    .country-stage { position: relative; z-index: 1; grid-column: var(--stage-start) / var(--stage-end); width: auto; min-width: 0; height: 34px; padding: 0 3px; border: 0; color: var(--ink); background: transparent; text-align: center; cursor: pointer; }\n', 1)
          s = s.replace('style="--stage-color:${stage.color};--stage-days:${stage.end-stage.start+1}"', 'style="--stage-color:${stage.color};--stage-start:${stage.start};--stage-end:${stage.end+1}"', 1)
          needle = '    function renderDayView() {\n      renderDayScroller();\n      renderCountryTrack();\n'
          insert = '    function enableHorizontalDrag(selector) {\n      const el = $(selector);\n      if (!el || el.dataset.dragReady) return;\n      el.dataset.dragReady = "1";\n      let dragging = false, startX = 0, startScroll = 0;\n      el.addEventListener("pointerdown", e => { if (e.button !== 0) return; dragging = true; startX = e.clientX; startScroll = el.scrollLeft; el.classList.add("dragging"); el.setPointerCapture?.(e.pointerId); });\n      el.addEventListener("pointermove", e => { if (dragging) el.scrollLeft = startScroll - (e.clientX - startX); });\n      const stop = () => { dragging = false; el.classList.remove("dragging"); };\n      el.addEventListener("pointerup", stop);\n      el.addEventListener("pointercancel", stop);\n      el.addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive:false});\n    }\n\n    function renderDayView() {\n      renderDayScroller();\n      renderCountryTrack();\n      enableHorizontalDrag("#dayScroller");\n      enableHorizontalDrag("#countryScroll");\n'
          if needle not in s: raise SystemExit('renderDayView needle missing')
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git add index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Align country timeline with days and enable desktop drag"
            git push origin HEAD:europe-trip-2026
          fi
