name: split shopping recommendations
on:
  push:
    branches: [refactor/finland-shopping-data-20260910]
    paths:
      - '.github/_split-shopping-recommendations-trigger'
jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/finland-shopping-data-20260910
      - name: Split recommendation renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('budget/index.html')
          s = p.read_text(encoding='utf-8')

          old = '''  $('#supermarketList').innerHTML=data.supermarkets.map(x=>`<article class="info-card recommend-card"><h3>${esc(x.date)}｜${esc(x.city)}</h3><div class="recommend-meta"><span class="recommend-pill">${esc(x.use)}</span></div><ul class="recommend-list">${x.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><p class="device-note">${esc(x.note)}</p></article>`).join('');
          const grouped={};data.souvenirs.forEach(x=>(grouped[x.country]||(grouped[x.country]=[])).push(x));
          $('#souvenirList').innerHTML=Object.entries(grouped).map(([country,rows])=>`<article class="info-card recommend-card"><h3>${esc(country)}</h3>${rows.map(x=>`<div class="souvenir-row"><div><b>${esc(x.item)}</b><small>${esc(x.reason)}</small><div class="recommend-meta"><span class="recommend-pill">${esc(x.place)}</span><span class="recommend-pill">${esc(x.tag)}</span></div></div><button class="add-shopping" type="button" data-add-item="${attr(x.item)}" data-add-country="${attr(country.replace(/^..\\s/,''))}">加入我的清單</button></div>`).join('')}</article>`).join('');
          '''
          new = '''  const recommendations=window.TravelShoppingRecommendations;
          if(!recommendations)throw new Error('Travel Shopping recommendations module is not loaded.');
          recommendations.render(data);
          '''
          if old not in s:
              raise SystemExit('Shopping recommendation renderer block not found exactly once')
          if s.count(old) != 1:
              raise SystemExit(f'Expected one recommendation block, found {s.count(old)}')
          s = s.replace(old, new, 1)

          marker = '<script src="../assets/modules/shopping/bootstrap.js?v=20260910-shopping1"></script>\n'
          addition = marker + '<script src="../assets/modules/shopping/recommendations.js?v=20260910-shopping2"></script>\n'
          if s.count(marker) != 1:
              raise SystemExit('Shopping bootstrap script tag not found exactly once')
          s = s.replace(marker, addition, 1)

          module = '''(() => {
            'use strict';

            const $ = s => document.querySelector(s);

            function esc(s){
              return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            }

            function attr(s){ return esc(s); }

            function render(data){
              $('#supermarketList').innerHTML=(data.supermarkets||[]).map(x=>`<article class="info-card recommend-card"><h3>${esc(x.date)}｜${esc(x.city)}</h3><div class="recommend-meta"><span class="recommend-pill">${esc(x.use)}</span></div><ul class="recommend-list">${(x.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><p class="device-note">${esc(x.note)}</p></article>`).join('');
              const grouped={};(data.souvenirs||[]).forEach(x=>(grouped[x.country]||(grouped[x.country]=[])).push(x));
              $('#souvenirList').innerHTML=Object.entries(grouped).map(([country,rows])=>`<article class="info-card recommend-card"><h3>${esc(country)}</h3>${rows.map(x=>`<div class="souvenir-row"><div><b>${esc(x.item)}</b><small>${esc(x.reason)}</small><div class="recommend-meta"><span class="recommend-pill">${esc(x.place)}</span><span class="recommend-pill">${esc(x.tag)}</span></div></div><button class="add-shopping" type="button" data-add-item="${attr(x.item)}" data-add-country="${attr(country.replace(/^..\\s/,''))}">加入我的清單</button></div>`).join('')}</article>`).join('');
            }

            window.TravelShoppingRecommendations=Object.freeze({render});
          })();
          '''
          out = Path('assets/modules/shopping/recommendations.js')
          if out.exists():
              raise SystemExit('recommendations.js already exists; refusing to overwrite')
          out.write_text(module, encoding='utf-8')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary inspection files
        run: rm -f .github/workflows/_inspect-shopping-recommendations.yml .github/_inspect-shopping-recommendations-trigger .github/shopping-recommendations-inspection.txt .github/workflows/_split-shopping-recommendations.yml .github/_split-shopping-recommendations-trigger
      - name: Commit split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/index.html assets/modules/shopping/recommendations.js .github/workflows/_inspect-shopping-recommendations.yml .github/_inspect-shopping-recommendations-trigger .github/shopping-recommendations-inspection.txt .github/workflows/_split-shopping-recommendations.yml .github/_split-shopping-recommendations-trigger
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: isolate Shopping recommendations renderer'
          git push
