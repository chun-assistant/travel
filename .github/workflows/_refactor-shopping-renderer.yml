name: refactor shopping renderer
on:
  push:
    branches: [refactor/finland-shopping-data-20260910]
    paths:
      - '.github/_refactor-shopping-renderer-trigger'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/finland-shopping-data-20260910
      - name: Extract Shopping renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('budget/index.html')
          s = p.read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', s, re.I)
          candidates = [b for b in blocks if 'AURORA_SHOPPING_DATA' in b and 'supermarketList' in b]
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one Shopping inline script, found {len(candidates)}')
          js = candidates[0].strip() + '\\n'
          out = Path('assets/modules/shopping/render.js')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("(() => {\\n  'use strict';\\n\\n" + js + "})();\\n", encoding='utf-8')
          pattern = r'<script(?:\\s[^>]*)?>' + re.escape(candidates[0]) + r'</script>'
          replacement = '<script src="../assets/modules/shopping/render.js?v=20260910-shopping2"></script>'
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.I)
          if n != 1:
              raise SystemExit(f'Failed to replace Shopping inline script: {n}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/_refactor-shopping-renderer.yml .github/_refactor-shopping-renderer-trigger
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/index.html assets/modules/shopping/render.js .github/workflows/_refactor-shopping-renderer.yml .github/_refactor-shopping-renderer-trigger
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract Shopping renderer'
          git push