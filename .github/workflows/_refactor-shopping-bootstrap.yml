name: refactor shopping bootstrap

on:
  push:
    branches:
      - refactor/finland-shopping-data-20260910

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Shopping script bundle with bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('budget/index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<script src="../assets/shopping-data.js?v=20260908-image2"></script>\n<script src="../assets/finland-shopping-extra.js?v=20260908-assets1"></script>\n<script src="../assets/finland-shopping-assets.js?v=20260909-assets1"></script>\n<script src="../assets/vienna-shopping-assets.js?v=20260908-assets2"></script>'''
          new = '''<script src="../assets/modules/shopping/bootstrap.js?v=20260910-shopping1"></script>'''
          if old not in s:
              raise SystemExit('Expected Shopping script bundle was not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/_refactor-shopping-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budget/index.html .github/workflows/_refactor-shopping-bootstrap.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: route Shopping asset loading through bootstrap'
          git push
