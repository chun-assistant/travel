name: Rebuild travel site from original UI
on:
  push:
    branches:
      - europe-trip-2026
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0
      - name: Rebuild split pages
        env:
          SCRIPT_B64: "
        run: |
          echo "$SCRIPT_B64" | base64 -d > /tmp/rebuild.py
          python3 /tmp/rebuild.py
      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original UI and split feature pages"
          git push origin europe-trip-2026
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-europe-trip-ui.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary rebuild workflow" || true
          git push origin europe-trip-2026 || true
