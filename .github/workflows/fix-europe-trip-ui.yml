name: Fix Europe Trip UI
on:
  push:
    branches:
      - europe-trip-2026
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0
      - name: Patch index.html
        env:
          PATCH_B64:  
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        run: |
          git add index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Fix timeline sync, country labels and day links"; git push origin HEAD:europe-trip-2026; fi
