name: Sync upstream travel branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: yangchinghsuan955-web/europe-trip-2026
          ref: main
          path: source

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          path: target
          fetch-depth: 0

      - name: Overwrite target contents
        working-directory: target
        run: |
          rsync -a --delete --exclude='.git' ../source/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: overwrite europe-trip-2026 with upstream main' || true
          git push --force origin HEAD:europe-trip-2026
