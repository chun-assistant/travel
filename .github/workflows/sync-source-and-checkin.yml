name: Sync source main and add flight check-in highlights
on: [push]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Stop recursive sync commit
        run: |
          if git log -1 --pretty=%B | grep -q '^Sync source main and add flight check-in highlights$'; then
            echo 'Already synced; stop.'
            exit 0
          fi
      - name: Copy source main
        run: |
          git clone --depth 1 --branch main https://github.com/yangchinghsuan955-web/europe-trip-2026.git /tmp/source
          rsync -a --delete --exclude='.git' /tmp/source/ ./
      - name: Add flight check-in markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('assets/common.js')
          s = js.read_text(encoding='utf-8')
          marker = '/* FLIGHT_CHECKIN_MARKERS */'
          if marker not in s:
              needle = '''      return `<button class="day-chip ${d.day===state.day?"active":""}" data-day="${d.day}" style="--day-color:${dayColor}"><b>Day ${d.day}</b><small>${escapeHtml(dateLabel(d.date))}</small><small class="day-place">${escapeHtml(d.city)}</small></button>`;'''
              replacement = '''      const checkin = ({1:"✈ 航班報到 · 9/24 23:35",9:"✈ 航班報到 · 10/2 03:40",14:"✈ 航班報到 · 10/7 05:50",15:"✈ 航班報到 · 10/8 11:00"})[d.day];
        return `<button class="day-chip ${d.day===state.day?"active":""}${checkin?" has-flight-checkin":""}" data-day="${d.day}" style="--day-color:${dayColor}"><b>Day ${d.day}</b><small>${escapeHtml(dateLabel(d.date))}</small><small class="day-place">${escapeHtml(d.city)}</small>${checkin?`<span class="flight-checkin-badge">${escapeHtml(checkin)}</span>`:""}</button>`;'''
              if needle not in s:
                  raise SystemExit('renderDayScroller needle not found')
              s = s.replace(needle, replacement, 1)
              s += '\n\n    /* FLIGHT_CHECKIN_MARKERS */\n'
              js.write_text(s, encoding='utf-8')
          css = Path('assets/common.css')
          c = css.read_text(encoding='utf-8')
          css_marker = '/* FLIGHT_CHECKIN_STYLE */'
          if css_marker not in c:
              c += '\n\n    /* FLIGHT_CHECKIN_STYLE */\n    .day-chip.has-flight-checkin { position: relative; padding-bottom: 29px; }\n    .day-chip .flight-checkin-badge { display:block; margin-top:4px; padding:3px 7px; border-radius:999px; color:var(--red); background:var(--red-soft); border:1px solid rgba(197,90,83,.30); font-size:9px; line-height:1.2; font-weight:850; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n    .day-chip.active .flight-checkin-badge { color:#fff; background:rgba(197,90,83,.84); border-color:rgba(255,255,255,.30); }\n'
              css.write_text(c, encoding='utf-8')
          PY
      - name: Commit synced source plus check-in markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync source main and add flight check-in highlights"
          git push
