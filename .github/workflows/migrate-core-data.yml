name: Migrate core runtime data

on:
  push:
    branches:
      - refactor-transport-safe-v2
    paths:
      - 'assets/common-runtime.js'
      - 'assets/common.js'
      - '.github/workflows/migrate-core-data.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[core-data-migrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract core data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/common-runtime.js')
          s=p.read_text(encoding='utf-8')

          c_marker='const COUNTRY_STAGES = ['
          c_start=s.find(c_marker)
          if c_start<0: raise SystemExit('COUNTRY_STAGES declaration not found')
          c_end=s.find('];',c_start)
          if c_end<0: raise SystemExit('COUNTRY_STAGES end not found')
          c_end+=2
          country=s[c_start+len('const COUNTRY_STAGES = '):c_end]

          a_marker='const APP_DATA = {'
          a_start=s.find(a_marker)
          if a_start<0: raise SystemExit('APP_DATA declaration not found')
          # APP_DATA is one JSON object followed by a semicolon. Find the matching closing brace.
          i=a_start+len('const APP_DATA = ')
          depth=0; in_str=False; esc=False; a_end=None
          for j,ch in enumerate(s[i:],i):
              if in_str:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': in_str=False
                  continue
              if ch=='"': in_str=True
              elif ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      a_end=j+1
                      break
          if a_end is None: raise SystemExit('APP_DATA end not found')
          app=s[i:a_end]

          data='''/* Extracted from the legacy runtime. Keep the data shape unchanged. */\n(function (root) {\n  const COUNTRY_STAGES = %s;\n  const APP_DATA = %s;\n  root.TravelCoreData = Object.freeze({\n    getCountryStages: function () { return COUNTRY_STAGES; },\n    getAppData: function () { return APP_DATA; }\n  });\n})(window);\n''' % (country, app)
          Path('assets/data/core.js').write_text(data,encoding='utf-8')

          # Remove the original declarations, keeping the legacy runtime's consumers unchanged.
          s=s[:c_start] + 'const COUNTRY_STAGES = window.TravelCoreData.getCountryStages();' + s[c_end:]
          # Re-find APP_DATA after COUNTRY_STAGES replacement.
          a_start=s.find(a_marker)
          i=a_start+len('const APP_DATA = ')
          depth=0; in_str=False; esc=False; a_end=None
          for j,ch in enumerate(s[i:],i):
              if in_str:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': in_str=False
                  continue
              if ch=='"': in_str=True
              elif ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      a_end=j+1
                      break
          s=s[:a_start] + 'const APP_DATA = window.TravelCoreData.getAppData();' + s[a_end:]
          p.write_text(s,encoding='utf-8')

          c=Path('assets/common.js')
          cs=c.read_text(encoding='utf-8')
          marker='var packingDataSrc = base + "data/packing.js";'
          if marker not in cs: raise SystemExit('packing loader marker not found')
          cs=cs.replace(marker, marker+'\n  var coreDataSrc = base + "data/core.js";',1)
          cs=cs.replace("document.write('<script src=\"' + packingDataSrc + '\"><\\/script>');", "document.write('<script src=\"' + packingDataSrc + '\"><\\/script>');\n    document.write('<script src=\"' + coreDataSrc + '\"><\\/script>');",1)
          cs=cs.replace('var scripts = [packingDataSrc, printDataSrc, legacySrc];','var scripts = [packingDataSrc, printDataSrc, coreDataSrc, legacySrc];',1)
          c.write_text(cs,encoding='utf-8')
          PY
      - name: Verify
        run: |
          test -s assets/data/core.js
          ! grep -q 'const COUNTRY_STAGES = \[' assets/common-runtime.js
          ! grep -q 'const APP_DATA = {' assets/common-runtime.js
          grep -q 'TravelCoreData' assets/common-runtime.js
          grep -q 'data/core.js' assets/common.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/core.js assets/common-runtime.js assets/common.js .github/workflows/migrate-core-data.yml
          git commit -m 'refactor: extract core data from common runtime [core-data-migrated]'
          git rm .github/workflows/migrate-core-data.yml
          git commit -m 'chore: remove core data migration workflow'
          git push
