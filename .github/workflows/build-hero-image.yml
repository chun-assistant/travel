name: Build Moomin hero image

on:
  push:
    branches: [main]
    paths:
      - 'assets/hero-moomin-watercolor.b64'
      - '.github/workflows/build-hero-image.yml'

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode generated hero image
        shell: bash
        run: |
          base64 --decode assets/hero-moomin-watercolor.b64 > assets/hero-moomin-watercolor.jpg
          file assets/hero-moomin-watercolor.jpg

      - name: Commit generated image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-moomin-watercolor.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add generated Moomin watercolor hero image"
          git push
