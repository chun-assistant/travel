name: extract daily scroll

on:
  push:
    branches: [refactor-transport-safe-v2]

permissions:
  contents: write

jobs:
  extract:
    if: contains(github.event.head_commit.message, '[skip daily scroll]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-transport-safe-v2
      - name: Extract scroll sync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          runtime = Path('assets/common-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          start = text.find('      const dayScroller = $("#dayScroller");')
          end = text.find('      const d = APP_DATA.overview.find(x => x.day === state.day);', start)
          if start < 0 or end < 0:
              raise SystemExit('daily scroll block not found')
          block = text[start:end]
          if 'syncCountryActive' not in block:
              raise SystemExit('unexpected scroll block')
          runtime.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          git diff --check
          ! grep -q 'syncCountryActive' assets/common-runtime.js
      - name: Commit extraction and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/common-runtime.js .github/workflows/extract-daily-scroll.yml
          git commit -m 'refactor: wire daily scroll module [skip daily scroll]'
          git push origin HEAD:refactor-transport-safe-v2
          git rm .github/workflows/extract-daily-scroll.yml
          git commit -m 'chore: remove daily scroll extraction workflow [skip daily scroll]'
          git push origin HEAD:refactor-transport-safe-v2
