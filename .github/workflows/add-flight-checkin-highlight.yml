name: Add flight check-in highlights
on:
  push:
    branches: [europe-trip-2026]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path

          js=Path('assets/common.js')
          s=js.read_text(encoding='utf-8')
          js_marker='/* FLIGHT_CHECKIN_HIGHLIGHT */'
          if js_marker not in s:
              old='    init();\n'
              new='''    init();\n\n    /* FLIGHT_CHECKIN_HIGHLIGHT */\n    (function(){\n      const checkins = [\n        {date:"2026-09-24", label:"✈ 航班報到 · CI0063／AY1472"},\n        {date:"2026-10-02", label:"✈ 航班報到 · WF993"},\n        {date:"2026-10-07", label:"✈ 航班報到 · SAS"},\n        {date:"2026-10-08", label:"✈ 航班報到 · CI0074"}\n      ];\n      function add(){\n        const chips = document.querySelectorAll('#dayScroller .day-chip');\n        if(!chips.length) return;\n        chips.forEach(chip=>{\n          const day = Number(chip.dataset.day);\n          const map = {1:"2026-09-24",9:"2026-10-02",14:"2026-10-07",15:"2026-10-08"};\n          const date = map[day];\n          const item = checkins.find(x=>x.date===date);\n          if(!item || chip.querySelector('.flight-checkin-badge')) return;\n          chip.insertAdjacentHTML('beforeend','<span class="flight-checkin-badge">'+item.label+'</span>');\n          chip.classList.add('has-flight-checkin');\n        });\n      }\n      const host=document.getElementById('dayScroller');\n      if(host) new MutationObserver(add).observe(host,{childList:true});\n      add();\n    })();\n'''
              if old not in s:
                  raise SystemExit('init marker not found')
              js.write_text(s.replace(old,new,1),encoding='utf-8')

          css=Path('assets/common.css')
          c=css.read_text(encoding='utf-8')
          css_marker='/* FLIGHT_CHECKIN_STYLE */'
          if css_marker not in c:
              c += '''\n\n    /* FLIGHT_CHECKIN_STYLE */\n    .day-chip.has-flight-checkin {\n      position: relative;\n      padding-bottom: 30px;\n    }\n    .day-chip.has-flight-checkin .flight-checkin-badge {\n      position: absolute;\n      left: 8px;\n      right: 8px;\n      bottom: 6px;\n      display: block;\n      overflow: hidden;\n      white-space: nowrap;\n      text-overflow: ellipsis;\n      padding: 3px 6px;\n      border-radius: 999px;\n      color: var(--red);\n      background: var(--red-soft);\n      border: 1px solid rgba(197,90,83,.28);\n      font-size: 9px;\n      font-weight: 800;\n      line-height: 1.2;\n    }\n    .day-chip.has-flight-checkin.active .flight-checkin-badge {\n      color: #fff;\n      background: rgba(197,90,83,.82);\n      border-color: rgba(255,255,255,.28);\n    }\n'''
              css.write_text(c,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/common.js assets/common.css
          git diff --cached --quiet && exit 0
          git commit -m "Add highlighted flight check-in labels to day chips"
          git push
