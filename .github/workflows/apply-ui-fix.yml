name: Apply Europe Trip UI Fix
on:
  push:
    branches:
      - europe-trip-2026
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0
      - name: Patch index.html
        run: python3 patch_ui.py
      - name: Verify
        run: |
          grep -q 'class="country-scroll" id="countryScroll"' index.html
          grep -q 'const syncCountryActive' index.html
      - name: Commit patch
        run: |
          git add index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix country timeline scroll sync"
            git push origin HEAD:europe-trip-2026
          fi
