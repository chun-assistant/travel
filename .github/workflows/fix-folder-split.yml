name: Fix folder-based travel pages
on:
  push:
    branches: [europe-trip-2026]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: europe-trip-2026
          fetch-depth: 0
      - name: Move pages and repair paths
        shell: bash
        run: |
          set -e
          mkdir -p daily transport stay prep-tools budget
          for pair in 'daily.html daily/index.html' 'transport.html transport/index.html' 'stay.html stay/index.html' 'prep-tools.html prep-tools/index.html' 'budget.html budget/index.html'; do
            set -- $pair
            if [ -f "$1" ] && [ ! -f "$2" ]; then git mv "$1" "$2"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          root = Path('index.html')
          s = root.read_text()
          s = s.replace('href="daily.html"', 'href="daily/"')
          s = s.replace('href="transport.html"', 'href="transport/"')
          s = s.replace('href="stay.html"', 'href="stay/"')
          s = s.replace('href="prep-tools.html"', 'href="prep-tools/"')
          s = s.replace('href="budget.html"', 'href="budget/"')
          root.write_text(s)
          for p in [Path('daily/index.html'), Path('transport/index.html'), Path('stay/index.html'), Path('prep-tools/index.html'), Path('budget/index.html')]:
            s = p.read_text()
            if '<base ' not in s:
              s = s.replace('<head>', '<head>\n<base href="../">', 1)
            p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Fix folder-based feature page paths'
            git push origin europe-trip-2026
          fi
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/fix-folder-split.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary split repair workflow' || true
          git push origin europe-trip-2026 || true
