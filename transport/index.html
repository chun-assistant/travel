<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102d3e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2026歐洲之旅">
  <title>2026 歐洲極光之旅｜18天行程 App</title>
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    .transport-card.is-unpaid{position:relative}
    .transport-card .unpaid-badge{display:inline-flex;align-items:center;gap:4px;margin:0 0 8px;padding:4px 9px;border-radius:999px;color:var(--red);background:var(--red-soft);border:1px solid rgba(197,90,83,.28);font-size:11px;line-height:1.1;font-weight:850}
    #transportFilters .unpaid-filter{color:var(--red);background:var(--red-soft);border-color:rgba(197,90,83,.28)}
    #transportFilters .unpaid-filter.active{color:#fff;background:var(--red);border-color:var(--red)}
  </style>
</head>
<body data-page="transport">
  <div class="app-shell">
    <header class="hero">
      <div class="stars"></div>
      <div class="hero-inner">
        <div class="eyebrow"><span>EUROPE · AURORA 2026</span><span class="eyebrow-badge" id="networkBadge"><i class="online-dot"></i><span>離線可查看</span></span></div>
        <h1>18天歐洲極光之旅</h1><p class="hero-sub">2026.09.24 — 10.11 · 奧地利・芬蘭・挪威・荷蘭</p>
        <div class="route-line" aria-label="旅行路線"><span class="route-stop">台北</span><span class="route-arrow">›</span><span class="route-stop">維也納</span><span class="route-arrow">›</span><span class="route-stop">赫爾辛基</span><span class="route-arrow">›</span><span class="route-stop">拉普蘭</span><span class="route-arrow">›</span><span class="route-stop">特羅姆瑟</span><span class="route-arrow">›</span><span class="route-stop">阿姆斯特丹</span></div>
        <div class="hero-stats"><div class="hero-stat"><b>18 天</b><small>完整逐時行程</small></div><div class="hero-stat"><b>248 站</b><small>一鍵開啟導航</small></div><div class="hero-stat"><b id="countdownValue">—</b><small id="countdownLabel">距離出發</small></div></div>
      </div>
    </header>
    <main><section class="tab-panel active" id="tab-transport" aria-labelledby="nav-transport"><div class="section-head"><div><h2>交通</h2><p>班次、費用、時間與路線集中查</p></div></div><div class="chip-row" id="transportFilters"></div><div class="card-list" id="transportList"></div></section></main>
  </div>
  <div id="splitRuntimeHost" hidden><div id="globalNotices"></div><div id="dayScroller"></div><div id="countryTrack"></div><div id="countryScroll"></div><div id="daySummary"></div><div id="eventFilters"></div><div id="eventTimeline"></div><div id="hotelList"></div><div id="ticketAppList"></div><div id="checklist"></div><div id="checkPercent"></div><div id="checkCount"></div><div id="progressFill"></div><div id="practicalList"></div><div id="bookingList"></div><div id="taxList"></div><div id="budgetSummary"></div><div id="budgetList"></div><div id="foodList"></div><div id="mealList"></div><div id="toast"></div><input id="eventSearch"><button id="clearSearch"></button><button id="jumpToday"></button><button id="resetChecks"></button><div id="budgetSegments"></div><div id="imageModal"></div><div id="imageModalContent"></div><div id="imageModalCaption"></div><button id="imageModalClose"></button></div>
  <nav class="bottom-nav" aria-label="主要導覽">
    <a class="nav-btn" href="../daily/" id="nav-days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 9h18"></path></svg>每日行程</a>
    <a class="nav-btn active" href="./" id="nav-transport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 17h14l1-6H4l1 6Z"></path><path d="M7 17v3M17 17v3M7 11l2-5h6l2 5M8 14h.01M16 14h.01"></path></svg>交通</a>
    <a class="nav-btn" href="../stay/" id="nav-hotels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v16M3 12h18M7 8h3M7 16h3M14 8h3M14 16h3"></path></svg>住宿</a>
    <a class="nav-btn" href="../prep-tools/" id="nav-luggage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="6" width="14" height="15" rx="2"></rect><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M8 10v7M12 10v7M16 10v7"></path></svg>行前與工具</a>
    <a class="nav-btn" href="../budget/" id="nav-budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg>餐食與購物</a>
  </nav>
  <script src="../assets/common.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    const flightDetails={
      'TPE→VIE／AMS→TPE':{url:'https://airportservice.china-airlines.com/eCheckin/eCheckin_home?country=tw&locale=zh',time:'9/22 23:45（48小時前）／10/8 11:00（48小時前）',how:'輸入訂位代號＋Full Name'},
      'VIE→HEL':{url:'https://www.finnair.com/hk-zh/manage/view?fromCheckIn=false',time:'9/24 23:35（36小時前）',how:'輸入訂位代號＋Last Name'},
      'KKN→TOS':{url:'https://www.flysas.com/en/checkin',time:'10/2 03:40（30小時前）',how:'輸入訂位代號＋Last Name'},
      'TOS→OSL→AMS':{url:'https://www.flysas.com/en/checkin',time:'10/7 05:50（30小時前）',how:'輸入訂位代號＋Last Name'}
    };
    function addFlightRows(){
      document.querySelectorAll('#transportList .transport-card').forEach(card=>{
        const title=card.querySelector('h3');
        if(!title||card.dataset.checkinAdded)return;
        const key=Object.keys(flightDetails).find(k=>title.textContent.trim().includes(k));
        if(!key)return;
        const d=flightDetails[key];
        card.dataset.checkinAdded='1';
        card.insertAdjacentHTML('beforeend','<div class="info-card-row"><span>網路報到網址</span><b><a href="'+d.url+'" target="_blank" rel="noopener">開啟報到頁面 ↗</a></b></div><div class="info-card-row"><span>網路報到時間</span><b>'+d.time+'</b></div><div class="info-card-row"><span>如何報到</span><b>'+d.how+'</b></div>');
      });
    }
    function removeObsoleteAmsterdamTransfer(){
      document.querySelectorAll('#transportList .transport-card').forEach(card=>{
        const title=card.querySelector('h3');
        if(title&&title.textContent.trim()==='Amsterdam ID→AMS')card.remove();
      });
    }
    function updateDay2ViennaTransfer(){
      document.querySelectorAll('#transportList .transport-card').forEach(card=>{
        const title=card.querySelector('h3');
        if(!title)return;
        const cardText=card.textContent.replace(/\s+/g,' ');
        if(!/Day\s*2|9\/25|維也納/.test(cardText) || !/機場|Airport|飯店/.test(cardText))return;
        if(card.dataset.day2TransferUpdated)return;
        card.dataset.day2TransferUpdated='1';
        card.querySelectorAll('.info-card-row').forEach(row=>row.remove());
        card.insertAdjacentHTML('beforeend','<div class="info-card-row"><span>時間</span><b>8:16（REX 7）／8:34（IC）<br>8:59／9:19 抵達飯店</b></div><div class="info-card-row"><span>方式</span><b>🚆 REX 7／IC → Vienna Central<br>🚇 U1 Südtiroler Platz → Stephansplatz<br>🚶 步行約 4 分鐘 → 飯店</b></div><div class="info-card-row"><span>時常</span><b>約 43–45 分鐘（依班次）</b></div><div class="info-card-row"><span>費用／人</span><b>依現有交通票券／當日票價</b></div><div class="info-card-row"><span>提醒</span><b>REX 7 與 IC 擇一；抵達 Vienna Central 後轉 U1。</b></div>');
      });
    }
    function markUnpaidCityTransport(){
      document.querySelectorAll('#transportList .transport-card').forEach(card=>{
        if(card.dataset.unpaidMarked)return;
        const text=card.textContent.replace(/\s+/g,' ');
        const isCityTransport=/Stephansplatz/.test(text)&&/(U1|Wien Hbf|Wien Hauptbahnhof|市區交通)/.test(text)&&!/(機場|Airport|VIE)/.test(text);
        if(!isCityTransport)return;
        card.dataset.unpaidMarked='1';
        card.classList.add('is-unpaid');
        const status=[...card.querySelectorAll('*')].find(el=>el.children.length===0&&el.textContent.trim()==='已更新');
        if(status)status.textContent='尚未購票';
        const title=card.querySelector('h3');
        if(title)title.insertAdjacentHTML('beforebegin','<div class="unpaid-badge">尚未購票</div>');
      });
    }
    function setupUnpaidFilter(){
      const filters=document.getElementById('transportFilters');
      if(!filters||filters.querySelector('.unpaid-filter'))return;
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='chip unpaid-filter';
      btn.textContent='尚未購票';
      btn.setAttribute('aria-pressed','false');
      btn.addEventListener('click',function(){
        markUnpaidCityTransport();
        const active=btn.classList.toggle('active');
        btn.setAttribute('aria-pressed',String(active));
        document.querySelectorAll('#transportList .transport-card').forEach(card=>{
          card.style.display=active?(card.classList.contains('is-unpaid')?'':'none'):'';
        });
      });
      filters.appendChild(btn);
    }
    function syncTransportCards(){
      removeObsoleteAmsterdamTransfer();
      addFlightRows();
      updateDay2ViennaTransfer();
      markUnpaidCityTransport();
      setupUnpaidFilter();
    }
    const list=document.getElementById('transportList');
    if(list)new MutationObserver(syncTransportCards).observe(list,{childList:true});
    syncTransportCards();
  });
  </script>
</body>
</html>
