<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d3e"><title>2026 歐洲極光之旅｜18天行程 App</title><link rel="stylesheet" href="../assets/common.css"><style>.transport-card.is-unpaid{position:relative}.transport-card .unpaid-badge{display:inline-flex;align-items:center;gap:4px;margin:0 0 8px;padding:4px 9px;border-radius:999px;color:var(--red);background:var(--red-soft);border:1px solid rgba(197,90,83,.28);font-size:11px;line-height:1.1;font-weight:850}#transportFilters .unpaid-filter{color:var(--red);background:var(--red-soft);border-color:rgba(197,90,83,.28)}#transportFilters .unpaid-filter.active{color:#fff;background:var(--red);border-color:var(--red)}</style></head>
<body data-page="transport"><div class="app-shell"><header class="hero"><div class="stars"></div><div class="hero-inner"><div class="eyebrow"><span>EUROPE · AURORA 2026</span><span class="eyebrow-badge" id="networkBadge"><i class="online-dot"></i><span>離線可查看</span></span></div><h1>18天歐洲極光之旅</h1><p class="hero-sub">2026.09.24 — 10.11 · 奧地利・芬蘭・挪威・荷蘭</p><div class="route-line" aria-label="旅行路線"><span class="route-stop">台北</span><span class="route-arrow">›</span><span class="route-stop">維也納</span><span class="route-arrow">›</span><span class="route-stop">赫爾辛基</span><span class="route-arrow">›</span><span class="route-stop">拉普蘭</span><span class="route-arrow">›</span><span class="route-stop">特羅姆瑟</span><span class="route-arrow">›</span><span class="route-stop">阿姆斯特丹</span></div><div class="hero-stats"><div class="hero-stat"><b>18 天</b><small>完整逐時行程</small></div><div class="hero-stat"><b>248 站</b><small>一鍵開啟導航</small></div><div class="hero-stat"><b id="countdownValue">—</b><small id="countdownLabel">距離出發</small></div></div></div></header><main><section class="tab-panel active" id="tab-transport" aria-labelledby="nav-transport"><div class="section-head"><div><h2>交通</h2><p>班次、費用、時間與路線集中查</p></div></div><div class="chip-row" id="transportFilters"></div><div class="card-list" id="transportList"></div></section></main></div><div id="splitRuntimeHost" hidden><div id="globalNotices"></div><div id="dayScroller"></div><div id="countryTrack"></div><div id="countryScroll"></div><div id="daySummary"></div><div id="eventFilters"></div><div id="eventTimeline"></div><div id="hotelList"></div><div id="ticketAppList"></div><div id="checklist"></div><div id="checkPercent"></div><div id="checkCount"></div><div id="progressFill"></div><div id="practicalList"></div><div id="bookingList"></div><div id="taxList"></div><div id="budgetSummary"></div><div id="budgetList"></div><div id="foodList"></div><div id="mealList"></div><div id="toast"></div><input id="eventSearch"><button id="clearSearch"></button><button id="jumpToday"></button><button id="resetChecks"></button><div id="budgetSegments"></div><div id="imageModal"></div><div id="imageModalContent"></div><div id="imageModalCaption"></div><button id="imageModalClose"></button></div><nav class="bottom-nav" aria-label="主要導覽"><a class="nav-btn" href="../daily/" id="nav-days">每日行程</a><a class="nav-btn active" href="./" id="nav-transport">交通</a><a class="nav-btn" href="../stay/" id="nav-hotels">住宿</a><a class="nav-btn" href="../prep-tools/" id="nav-luggage">行前與工具</a><a class="nav-btn" href="../budget/" id="nav-budget">餐食與購物</a></nav><script src="../assets/common.js"></script><script>
document.addEventListener('DOMContentLoaded',function(){
const flightDetails={'TPE→VIE／AMS→TPE':{url:'https://airportservice.china-airlines.com/eCheckin/eCheckin_home?country=tw&locale=zh',time:'9/22 23:45（48小時前）／10/8 11:00（48小時前）',how:'輸入訂位代號＋Full Name'},'VIE→HEL':{url:'https://www.finnair.com/hk-zh/manage/view?fromCheckIn=false',time:'9/24 23:35（36小時前）',how:'輸入訂位代號＋Last Name'},'KKN→TOS':{url:'https://www.flysas.com/en/checkin',time:'10/2 03:40（30小時前）',how:'輸入訂位代號＋Last Name'},'TOS→OSL→AMS':{url:'https://www.flysas.com/en/checkin',time:'10/7 05:50（30小時前）',how:'輸入訂位代號＋Last Name'}};
function addFlightRows(){document.querySelectorAll('#transportList .transport-card').forEach(card=>{const title=card.querySelector('h3');if(!title||card.dataset.checkinAdded)return;const key=Object.keys(flightDetails).find(k=>title.textContent.trim().includes(k));if(!key)return;const d=flightDetails[key];card.dataset.checkinAdded='1';card.insertAdjacentHTML('beforeend','<div class="info-card-row"><span>網路報到網址</span><b><a href="'+d.url+'" target="_blank" rel="noopener">開啟報到頁面 ↗</a></b></div><div class="info-card-row"><span>網路報到時間</span><b>'+d.time+'</b></div><div class="info-card-row"><span>如何報到</span><b>'+d.how+'</b></div>')})}
function removeObsoleteAmsterdamTransfer(){document.querySelectorAll('#transportList .transport-card').forEach(card=>{const title=card.querySelector('h3');if(title&&title.textContent.trim()==='Amsterdam ID→AMS')card.remove()})}
function updateDay2ViennaTransfer(){document.querySelectorAll('#transportList .transport-card').forEach(card=>{const title=card.querySelector('h3');if(!title)return;const cardText=card.textContent.replace(/\s+/g,' ');if(!/Day\s*2|9\/25|維也納/.test(cardText)||!/機場|Airport|飯店/.test(cardText))return;if(card.dataset.day2TransferUpdated)return;card.dataset.day2TransferUpdated='1';title.textContent='VIE→Südtiroler Platz→Stephansplatz→飯店';card.querySelectorAll('.info-card-row').forEach(row=>row.remove());card.insertAdjacentHTML('beforeend','<div class="info-card-row"><span>時間</span><b>8:16（REX 7）／8:34（IC）<br>8:59／9:11 抵達飯店</b></div><div class="info-card-row"><span>方式</span><b>🚆 REX 7／IC → Vienna Central<br>🚶 步行約 6 分鐘 → Südtiroler Platz<br>🚇 U1 Leopoldau → Stephansplatz<br>🚶 步行約 4 分鐘／350 公尺 → 飯店</b></div><div class="info-card-row"><span>時常</span><b>約 37–43 分鐘（依班次）</b></div><div class="info-card-row"><span>費用／人</span><b>EUR 4.4</b></div><div class="info-card-row"><span>提醒</span><b>尚未購票；REX 7 與 IC 擇一。8:16 班次 8:59 抵達，8:34 班次 9:11 抵達。</b></div>')})}
function markUnpaid(){document.querySelectorAll('#transportList .transport-card').forEach(card=>{if(card.dataset.unpaidMarked)return;const text=card.textContent.replace(/\s+/g,' ');if(!/Stephansplatz/.test(text)||!/U1|機場|Airport|VIE/.test(text))return;card.dataset.unpaidMarked='1';card.classList.add('is-unpaid');const status=[...card.querySelectorAll('*')].find(el=>el.children.length===0&&el.textContent.trim()==='已更新');if(status)status.textContent='尚未購票';const title=card.querySelector('h3');if(title&&!title.previousElementSibling?.classList.contains('unpaid-badge'))title.insertAdjacentHTML('beforebegin','<div class="unpaid-badge">尚未購票</div>')})}
function setupFilter(){const filters=document.getElementById('transportFilters');if(!filters||filters.querySelector('.unpaid-filter'))return;const btn=document.createElement('button');btn.type='button';btn.className='filter-chip unpaid-filter';btn.textContent='尚未購票';btn.setAttribute('aria-pressed','false');btn.addEventListener('click',function(){markUnpaid();const active=btn.classList.toggle('active');btn.setAttribute('aria-pressed',String(active));document.querySelectorAll('#transportList .transport-card').forEach(card=>card.style.display=active?(card.classList.contains('is-unpaid')?'':'none'):'')});filters.addEventListener('click',function(e){const other=e.target.closest('.filter-chip');if(!other||other===btn)return;btn.classList.remove('active');btn.setAttribute('aria-pressed','false');document.querySelectorAll('#transportList .transport-card').forEach(card=>card.style.display='')});filters.appendChild(btn)}
function sync(){removeObsoleteAmsterdamTransfer();addFlightRows();updateDay2ViennaTransfer();markUnpaid();setupFilter()}const list=document.getElementById('transportList');if(list)new MutationObserver(sync).observe(list,{childList:true});sync();});
</script></body></html>
